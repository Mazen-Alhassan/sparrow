[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sparrow"
version = "0.1.0"
description = "Reachability-based vulnerability triage for Python applications."
requires-python = ">=3.10"

# Standard library only by design. Nothing to list here.
dependencies = []

[project.scripts]
sparrow = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.sparrow", "src.sparrow.sinks"]
