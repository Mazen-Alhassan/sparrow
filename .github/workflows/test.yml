name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      # The suite is offline: it builds call graphs from fixtures on disk and never touches
      # PyPI or OSV. The adversarial cases execute their own sample apps to prove the sink runs.
      - run: python -m pytest tests/ -q
